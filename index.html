<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Job Tracker — Jayanth Pasupuleti</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="avatar">JP</div>
      <div class="nav-titles">
        <div class="nav-title">Job Tracker</div>
        <div class="nav-sub">Jayanth Pasupuleti · Senior Data Engineer</div>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-add-top">+ Add</button>
  </div>
</header>

<main class="page">

  <section class="hero">
    <h1 class="large-title">Applications</h1>
    <p class="sync-line"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Syncing…</span>
      <button class="link-btn" id="btn-sync">Sync now</button>
    </p>
  </section>

  <div class="searchbar">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input type="search" id="filter-q" placeholder="Search company, role, location, notes" autocomplete="off" aria-label="Search applications">
  </div>

  <section class="stats-strip" id="stat-cards" aria-label="Stats"></section>

  <section class="glass-card pipeline" aria-label="Pipeline">
    <h2>Pipeline</h2>
    <div class="funnel" id="funnel"></div>
  </section>

  <section class="controls glass-card" aria-label="Filters">
    <div class="seg" id="status-seg" role="tablist" aria-label="Status filter">
      <button class="seg-btn is-active" data-status="all" role="tab">All</button>
      <button class="seg-btn" data-status="not-applied" role="tab">To apply</button>
      <button class="seg-btn" data-status="applied" role="tab">Applied</button>
      <button class="seg-btn" data-status="on-hold" role="tab">On hold</button>
    </div>
    <div class="controls-row">
      <div class="chips" id="prio-chips" aria-label="Priority filter">
        <button class="chip is-active" data-prio="all">All</button>
        <button class="chip" data-prio="High">High</button>
        <button class="chip" data-prio="Medium">Medium</button>
        <button class="chip" data-prio="Low">Low</button>
      </div>
      <label class="switch-wrap"><span>Remote only</span>
        <span class="switch"><input type="checkbox" id="filter-remote"><span class="knob"></span></span>
      </label>
      <select id="sort-by" aria-label="Sort applications">
        <option value="priority">Priority</option>
        <option value="date">Newest</option>
        <option value="company">Company A–Z</option>
      </select>
    </div>
    <p class="result-count" id="result-count"></p>
  </section>

  <section class="app-list" id="app-list" aria-label="Applications"></section>

  <section class="glass-card" aria-label="Profile">
    <h2>Profile</h2>
    <div class="profile-grid">
      <div class="profile-field"><span class="label">Name</span><span id="p-name"></span></div>
      <div class="profile-field"><span class="label">Title</span><span id="p-title"></span></div>
      <div class="profile-field"><span class="label">Location</span><span id="p-location"></span></div>
      <div class="profile-field"><span class="label">Work authorization</span><span id="p-auth" class="pill pill-warn"></span></div>
      <div class="profile-field"><span class="label">Target salary</span><span id="p-salary"></span></div>
      <div class="profile-field"><span class="label">Availability</span><span id="p-avail" class="pill pill-ok"></span></div>
      <div class="profile-field"><span class="label">Email</span><a id="p-email" href="#"></a></div>
      <div class="profile-field"><span class="label">LinkedIn</span><a id="p-linkedin" href="#" target="_blank" rel="noopener"></a></div>
      <div class="profile-field full"><span class="label">Top skills</span><span id="p-skills" class="skills"></span></div>
    </div>
  </section>

  <section class="glass-card" aria-label="Quick apply facts">
    <h2>Quick apply facts <span class="hint">tap to copy</span></h2>
    <div class="facts-grid" id="facts-grid"></div>
  </section>

  <footer class="foot glass-card">
    <button class="btn" id="btn-export">Export JSON</button>
    <button class="btn" id="btn-import">Import JSON</button>
    <button class="btn btn-danger" id="btn-reset">Reset</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  </footer>

</main>

<button class="fab" id="btn-add" aria-label="Add application">+</button>

<div class="sheet-backdrop" id="modal-backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="grabber" aria-hidden="true"></div>
    <h2 id="modal-title">Add application</h2>
    <form id="app-form" novalidate>
      <div class="form-grid">
        <label>Company*<input name="company" required placeholder="Acme Corp"></label>
        <label>Role title*<input name="title" required placeholder="Senior Data Engineer"></label>
        <label>Location<input name="location" placeholder="Remote US"></label>
        <label>Pay<input name="pay" placeholder="$140–175k/yr"></label>
        <label>Job board<input name="board" placeholder="LinkedIn / Built In / Dice"></label>
        <label class="full">Apply URL<input name="url" type="url" placeholder="https://…"></label>
        <label>Status
          <select name="status">
            <option value="not-applied">Not applied</option>
            <option value="applied">Applied</option>
            <option value="screening">Screening</option>
            <option value="interview">Interview</option>
            <option value="offer">Offer</option>
            <option value="on-hold">On hold</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <label>Priority
          <select name="priority">
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
          </select>
        </label>
        <label>Date added<input name="dateAdded" type="date" value="2026-09-20"></label>
        <label class="check"><span class="switch"><input name="remote" type="checkbox"><span class="knob"></span></span> Remote role</label>
        <label class="check"><span class="switch"><input name="tailored" type="checkbox"><span class="knob"></span></span> Tailored resume ready</label>
        <label class="full">Notes<textarea name="notes" rows="3" placeholder="Fit notes, OPT/E-Verify flags…"></textarea></label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-danger" id="btn-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
